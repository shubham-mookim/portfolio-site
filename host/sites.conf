# ---------------------------------------------------------------------------
# Site manifest — one line per site. Whitespace-separated fields:
#
#   name     short id (used for the sites/<name> folder and log names)
#   source   "self" = this repo's own root, OR a git URL to clone
#   port     unique local port for that site's static server
#   expose   "quick" = give it a public Cloudflare quick-tunnel URL
#            "none"  = serve locally only (no public URL)
#   subdir   OPTIONAL subfolder inside the source that holds index.html (default ".")
#
# After editing: on the phone run  bash host/up.sh
# ---------------------------------------------------------------------------
#
#   A source may pin a branch as  <git-url>#<branch>.  The portfolio is built
#   by GitHub Actions and published to the `live` branch, so the phone only
#   ever pulls finished HTML — it never runs a build.
#
# name        source                                                        port   expose   subdir
portfolio     https://github.com/shubham-mookim/portfolio-site.git#live      8080   quick    .
#
# --- add more sites below (uncomment and edit) ---
# labs         https://github.com/shubham-mookim/labs.git          8081   quick   .
# diary        https://github.com/shubham-mookim/diary.git         8082   quick   public
# secret-tool  https://github.com/shubham-mookim/internal.git      8083   none    .
